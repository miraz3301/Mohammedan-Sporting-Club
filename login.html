<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login | Mohammedan FC</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet">
    </head>

    <body class="login-page">

        <div class="blur blur1"></div>
        <div class="blur blur2"></div>

        <header>
            <div class="logo">
                <img src="image/logo.png" alt="MOHAMMEDAN Logo">
                <div class="logo-text">
                    <h2>MOHAMMEDAN <br>FOOTBALL CLUB</h2>
                    <span>Football Club Management System</span>
                </div>
            </div>

            <a href="index.html" class="secondary">
                ← Back
            </a>
        </header>

        <div class="login-container">
            <div class="modern-login-card">
                <span class="role-badge">PORTAL ACCESS</span>
                <h1>Sign In</h1>
                <p>Select your role and enter your credentials.</p>

                <!-- Role Switcher -->
                <div class="role-selector">
                    <button type="button" class="role-btn active" data-role="player">Player</button>
                    <button type="button" class="role-btn" data-role="employee">Employee</button>
                    <button type="button" class="role-btn" data-role="coach">Coach</button>
                </div>

                <form id="loginForm">
                    <input type="hidden" id="selectedRole" value="player">

                    <div class="input-group">
                        <input type="text" id="username" placeholder=" " required autocomplete="off">
                        <label for="username">Username or ID</label>
                    </div>

                    <div class="input-group">
                        <input type="password" id="password" placeholder=" " required>
                        <label for="password">Password</label>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span>Sign In as <span id="btnRoleLabel">Player</span></span> →
                    </button>
                </form>

                <div class="login-footer">
                    <p>Demo Account • <b>admin</b> / <b>1234</b></p>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>

</html>
